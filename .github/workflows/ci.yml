name: CI

on:
  push:
    branches:
      - main
      - feat/*
      - docs/*
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.13.0

      - name: Install dependencies
        # Temporary until the generated package-lock.json is committed.
        # The production gate must switch this step to npm ci.
        run: npm install --no-audit --no-fund

      - name: Run syntax check
        run: npm run check

      - name: Run unit tests
        run: npm test

      - name: Run Next.js build verification
        run: npm run build

      - name: Build production container
        run: docker build --pull -t revora-ide:ci .
