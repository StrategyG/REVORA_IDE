name: CI

on:
  push:
    branches:
      - main
      - feat/*
      - docs/*
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run syntax check
        run: npm run check

      - name: Run unit tests
        run: npm test

      - name: Run Next.js build verification
        run: npm run build
